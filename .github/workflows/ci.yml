name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Keep this version in sync with the ruff-pre-commit rev in .pre-commit-config.yaml.
      - run: pip install -e ".[dev,api,agent]" "ruff==0.15.17" mypy
      # Hard gate: syntax errors and undefined names must always be zero.
      - name: Ruff syntax/undefined-name gate
        run: ruff check ado2gh/ services/ --select E9,F821 --target-version py311
      - run: ruff check ado2gh/ services/
      - run: mypy ado2gh/ --ignore-missing-imports || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,api,agent]"
      # FR-027a coverage ratchet: this number is the honest whole-package figure
      # measured on the green suite with no `omit` list (see specs/013-clean-code-arch-remediation/plan.md
      # § Coverage measurement). Raise it after each increment, never lower it.
      # The constitutional 85 % target stays outstanding as gap G-seed 4.
      - run: pytest --cov=ado2gh --cov-fail-under=56
  ui-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/migration-ui/package-lock.json
      - run: npm ci
        working-directory: apps/migration-ui
      - run: npm test
        working-directory: apps/migration-ui
