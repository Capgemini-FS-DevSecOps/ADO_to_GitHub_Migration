name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -e ".[dev]"

      - name: Validate package metadata and sample configuration
        run: |
          python -m pip check
          python -c "from ado2gh.core.config_loader import ConfigLoader; ConfigLoader.load('migration.yaml')"
          ado2gh --version

      - name: Run tests
        run: pytest -q

  ui:
    name: UI tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/migration-ui/package-lock.json

      - name: Install UI dependencies
        working-directory: apps/migration-ui
        run: npm ci

      - name: Test UI
        working-directory: apps/migration-ui
        run: npm test

      - name: Build UI
        working-directory: apps/migration-ui
        run: npm run build
