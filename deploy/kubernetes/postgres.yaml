apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ado2gh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: ado2gh
            - name: POSTGRES_DB
              value: ado2gh
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ado2gh-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ado2gh
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
