[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ado2gh"
version = "6.0.0"
description = "Planner-Executor-Validator Azure DevOps to GitHub migration agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0,<9",
    "requests>=2.31.0,<3",
    "PyYAML>=6.0,<7",
    "rich>=13.0.0,<15",
    "urllib3>=2.0.0,<3",
    "pydantic>=2.0.0,<3",
]

[project.optional-dependencies]
app-auth = [
    "cryptography>=41.0.7,<47",
    "PyJWT>=2.8.0,<3",
]
governance = [
    "cryptography>=41.0.7,<50",
]
api = [
    "fastapi>=0.111.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    "httpx>=0.27.0,<1",
    "PyNaCl>=1.5.0,<2",
]
agent = [
    "langchain>=0.2,<2",
    "langchain-core>=0.2,<2",
    "langgraph>=0.1,<2",
    "langchain-openai>=0.1,<2",
    "langchain-anthropic>=0.1,<2",
]
postgres = [
    "psycopg2-binary>=2.9.9,<3",
]
redis = [
    "redis>=5.0.0,<7",
]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
]

[project.scripts]
ado2gh = "ado2gh.cli.main:cli"

[tool.setuptools.packages.find]
include = ["ado2gh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
