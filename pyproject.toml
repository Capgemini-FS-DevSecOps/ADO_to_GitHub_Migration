[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ado2gh"
version = "6.0.0"
description = "Planner-Executor-Validator Azure DevOps to GitHub migration agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0,<9",
    "requests>=2.31.0,<3",
    "PyYAML>=6.0,<7",
    "rich>=13.0.0,<15",
    "urllib3>=2.0.0,<3",
]

[project.optional-dependencies]
app-auth = [
    "cryptography>=41.0.7,<47",
    "PyJWT>=2.8.0,<3",
]
governance = [
    "cryptography>=41.0.7,<50",
]
dev = [
    "pytest>=8.0,<10",
]

[project.scripts]
ado2gh = "ado2gh.cli:cli"

[tool.setuptools.packages.find]
include = ["ado2gh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
