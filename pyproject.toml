[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ado2gh"
version = "5.1.0"
description = "Azure DevOps to GitHub Enterprise Migration Accelerator"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "urllib3>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
app-auth = [
    "cryptography>=41.0.7",
    "PyJWT>=2.8.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "PyNaCl>=1.5.0",
]
postgres = [
    "psycopg2-binary>=2.9.9",
]
redis = [
    "redis>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
ado2gh = "ado2gh.cli.main:cli"

[tool.setuptools.packages.find]
include = ["ado2gh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = """
--cov=ado2gh.api.platform_rbac
--cov=ado2gh.api.live_approval_store
--cov=ado2gh.api.llm.llm_model_store
--cov=ado2gh.api.connectivity_store
--cov=ado2gh.api.llm.model_catalog
--cov=ado2gh.api.llm.model_validation
--cov=ado2gh.api.credentials.cloud_credentials_store
--cov=ado2gh.api.credentials.cloud_credential_detector
--cov=ado2gh.api.credentials.cloud_credential_probe
--cov=ado2gh.api.llm.platform_managed_model
--cov=ado2gh.api.agent_models
--cov=ado2gh.api.llm.http_llm
--cov=ado2gh.auth.service
--cov=ado2gh.agents.llm_provider
--cov=ado2gh.agents.session_state_machine
--cov=ado2gh.agents.session_store
--cov=ado2gh.agents.repo_lock_store
--cov=ado2gh.agents.rollback_tracker
--cov=ado2gh.agents.resource_mapping
--cov=ado2gh.agents.context_window
--cov=ado2gh.agents.pev_cycle
--cov=ado2gh.agents.metrics
--cov=ado2gh.agents.migration_agent
--cov=ado2gh.agents.migration_agent.graph
--cov=ado2gh.agents.migration_agent.nodes
--cov=ado2gh.agents.migration_agent.orchestrator
--cov=ado2gh.agents.migration_agent.llm_bridge
--cov=ado2gh.agents.migration_agent.session_state
--cov=ado2gh.agents.migration_agent.session_store
--cov=ado2gh.agents.migration_agent.context_window
--cov=ado2gh.agents.migration_agent.guardrails
--cov=ado2gh.agents.migration_agent.tool_catalog
--cov=ado2gh.agents.migration_agent.forms
--cov=ado2gh.agents.migration_agent.policies
--cov=ado2gh.agents.migration_agent.utils
--cov=ado2gh.agents.migration_agent.constants
--cov-report=term-missing
--cov-fail-under=85
"""

[tool.coverage.run]
omit = [
    "ado2gh/cli/*",
    "ado2gh/state/*",
    "ado2gh/core/*",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["ado2gh.state.*", "ado2gh.cli.*", "ado2gh.pipelines.*"]
ignore_errors = true
